<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barbearia</title>
    <style>
        /* Corpo da página */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f4f4f9;
            overflow-x: hidden; /* Impede rolagem horizontal */
        }
    
        /* Container do formulário */
        .container {
            width: 90%;
            max-width: 400px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            box-sizing: border-box; /* Garantir que o padding não afete a largura total */
        }
    
        h1 {
            color: #333;
            font-size: 24px;
        }
    
        /* Estilos do formulário */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    
        input, button {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            width: 100%; /* Garante que os campos ocupem toda a largura disponível */
        }
    
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
        }
    
        button:hover {
            background-color: #0056b3;
        }
    
        /* Link de retorno */
        .back-link {
            margin-top: 10px;
        }
    
        .back-link a {
            color: #007BFF;
            text-decoration: none;
        }
    
        .back-link a:hover {
            text-decoration: underline;
        }
    
        /* Estilo para mensagem de erro */
        .error-message {
            color: red;
            font-weight: bold;
            margin-top: 10px;
        }
    
        /* Responsividade: Ajusta o tamanho da tela para dispositivos menores */
        @media (max-width: 480px) {
            h1 {
                font-size: 20px;
            }
    
            .container {
                padding: 15px;
            }
    
            input, button {
                font-size: 14px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Login do Barbeiro</h1>
        <form action="/login" method="post">
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Entrar</button>
        </form>

        {% if mensagem %}
            <p class="error-message">{{ mensagem }}</p>
        {% endif %}

        <div class="back-link">
            <a href="/">Voltar para a Fila</a>
        </div>
    </div>
</body>
</html>
